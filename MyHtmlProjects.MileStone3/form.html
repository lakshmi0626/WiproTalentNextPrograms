<!DOCTYPE html>
<html>
<head>
    <title>Visitor Information</title>
</head>
<body>

    <table border="1" cellpadding="10">

        <tr>
            <td colspan="2">
                <h2>Visitors information</h2>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <hr>
            </td>
        </tr>

        <tr>
            <td>Email Address</td>
            <td>
                <input type="text" name="email">
            </td>
        </tr>

        <tr>
            <td>User's Interest</td>
            <td>
                <input type="checkbox" name="interest" value="research">
                Research

                <input type="checkbox" name="interest" value="purchase">
                Purchase
            </td>
        </tr>

        <tr>
            <td>Occupation</td>
            <td>
                <select name="occupation">
                    <option value="select">Select one</option>
                    <option value="student">Student</option>
                    <option value="employee">Employee</option>
                    <option value="business">Business</option>
                    <option value="teacher">Teacher</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Want us to send you junk emails?</td>
            <td>
                <input type="radio" name="junk" value="absolutely">
                Absolutely

                <input type="radio" name="junk" value="no">
                No way man
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>

</body>
</html>
