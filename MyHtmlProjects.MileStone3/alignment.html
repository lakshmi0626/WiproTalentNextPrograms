<!DOCTYPE html>
<html>

<head>
    <title>Alignment</title>
</head>

<body>

<h2>Different Alignments</h2>

<p align="left">
    This is left aligned text.
</p>

<p align="center">
    This is center aligned text.
</p>

<p align="right">
    This is right aligned text.
</p>

<p align="justify">
    This is justified text. This paragraph is used to demonstrate
    how text appears when it is justified on the page.
</p>

</body>
</html>
