<!DOCTYPE html>
<html>

<head>
    <title>HTML5 Form Attributes</title>
</head>

<body>

<h2>Visitors Information</h2>

<div>

<form>

    <table border="1" cellpadding="10">

        <tr>
            <td>Email Address</td>
            <td>
                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </td>
        </tr>

        <tr>
            <td>User's Interest</td>
            <td>
                <input type="checkbox" name="interest" value="research">
                Research

                <input type="checkbox" name="interest" value="purchase">
                Purchase
            </td>
        </tr>

        <tr>
            <td>Occupation</td>
            <td>
                <select name="occupation" required>
                    <option value="">Select one</option>
                    <option>Student</option>
                    <option>Employee</option>
                    <option>Teacher</option>
                    <option>Business</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Want us to send you junk emails?</td>
            <td>
                <input type="radio" name="junk" required>
                Absolutely

                <input type="radio" name="junk">
                No way man
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>

</form>

</div>


<hr>


<h2>Online Registration</h2>

<div>

<form>

    <table border="1" cellpadding="10">

        <tr>
            <td>Username</td>
            <td>
                <input type="text"
                       name="username"
                       placeholder="Enter username"
                       required>
            </td>
        </tr>

        <tr>
            <td>Password</td>
            <td>
                <input type="password"
                       name="password"
                       placeholder="Enter password"
                       required>
            </td>
        </tr>

        <tr>
            <td>Confirm Password</td>
            <td>
                <input type="password"
                       name="confirm"
                       placeholder="Confirm password"
                       required>
            </td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender" required>
                Male

                <input type="radio" name="gender">
                Female
            </td>
        </tr>

        <tr>
            <td>Address</td>
            <td>
                <textarea name="address"
                          rows="5"
                          cols="30"
                          placeholder="Enter your address"
                          required></textarea>
            </td>
        </tr>

        <tr>
            <td>Profession</td>
            <td>
                <select name="profession" required>
                    <option value="">Select Profession</option>
                    <option>Student</option>
                    <option>Engineer</option>
                    <option>Teacher</option>
                    <option>Doctor</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Upload Documents</td>
            <td>
                <input type="file"
                       name="documents"
                       multiple>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Register">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>

</form>

</div>

</body>
</html>
