<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

    <h2>My Favorite Programming Languages</h2>

    <h3>Ordered List</h3>
    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>JavaScript</li>
        <li>C++</li>
    </ol>

    <h3>Unordered List</h3>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>React</li>
        <li>Spring Boot</li>
    </ul>

</body>
</html>
