<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 1</title>
    <style>
        /* Unvisited link */
        a:link {
            color: #FF0000;
        }
        /* Visited link */
        a:visited {
            color: #FFFF00;
        }
        /* Mouse over link */
        a:hover {
            color: #FF00FF;
        }
        /* Selected (active) link */
        a:active {
            color: #0000FF;
        }
    </style>
</head>
<body>

    <a href="https://example.com">Sample Hyperlink</a>

</body>
</html>
