<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3</title>
    <style>
        /* Unvisited link */
        a:link {
            background-color: #FF0000;
        }
        /* Visited link */
        a:visited {
            background-color: #FFFF00;
        }
        /* Mouse over link */
        a:hover {
            background-color: #FF00FF;
        }
        /* Selected (active) link */
        a:active {
            background-color: #0000FF;
        }
    </style>
</head>
<body>

    <a href="https://example.com">Background Color Link</a>

</body>
</html>
