<!DOCTYPE html>
<html>
<head>
  <style>
    p {
      border-width: 10px;
      border-style: dotted;
      border-color: #0000ff;
      /* Alternatively, shorthand: border: 10px dotted #0000ff; */
    }
  </style>
</head>
<body>
  <p>This paragraph has a 10px dotted blue border.</p>
</body>
</html>
